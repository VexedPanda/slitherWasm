[package]
name = "slither-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Slitherlink loop solver compiled to WebAssembly"

[features]
# Time the HARD engine's rules (native builds only)
profile = []

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
